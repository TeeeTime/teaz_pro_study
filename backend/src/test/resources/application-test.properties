# Tests: in-memory database, mock AI, temp storage. Combined with "prod" in
# SecurityConfigTests to test the real security rules without Postgres.
spring.datasource.url=jdbc:h2:mem:study-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
study.ai.api-key=
study.storage-dir=${java.io.tmpdir}/study-test-files

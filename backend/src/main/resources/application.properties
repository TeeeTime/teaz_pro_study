spring.application.name=study

# Local dev: file-based H2 in PostgreSQL mode, so no Docker or database install is
# needed (see teaz_pro/docs/TECH_STACK.md). Prod uses Postgres from compose.yml.
spring.datasource.url=jdbc:h2:file:./data/study-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# Schema comes from Flyway (db/migration), never from Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Errors as RFC 9457 problem details, so the UI can show their "detail".
spring.mvc.problemdetails.enabled=true

# Lecture scripts can be large; Claude's Files API takes up to 500 MB per file.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=300MB

# Uploaded material (originals). Prod: a Docker volume, see compose.yml.
study.storage-dir=./data/files

# Claude API key. Unset = MockStudyAi with canned lectures and pages (local dev),
# like the frontend's mock auth. Set ANTHROPIC_API_KEY to use the real API locally.
study.ai.api-key=${ANTHROPIC_API_KEY:}
# Splits uploaded material into lectures (one call per upload, needs the best reading).
study.ai.analysis-model=claude-opus-5-5
# Writes the learning pages and answers the per-lecture chat (many calls).
study.ai.content-model=claude-sonnet-5-5
